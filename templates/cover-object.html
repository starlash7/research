{% extends "base.html" %}
{% block canvas %}
<main class="canvas cover-object-canvas">
  <p class="cover-category">{{ category }}</p>

  <section class="object-copy">
    <h1 class="object-title">{{ title }}</h1>
    <p class="object-subtitle">{{ subtitle }}</p>
  </section>

  {% if hero_uri %}
    <div class="object-stage" aria-hidden="true">
      <div class="atlas-media-frame">
        <img class="hero-image" src="{{ hero_uri }}" alt="">
      </div>
    </div>
  {% endif %}

  {% set footer_class = "object-footer" %}
  {% set logo_treatment = "logo-on-dark" %}
  {% include "partials/fixed-footer.html" %}
</main>
{% endblock %}
