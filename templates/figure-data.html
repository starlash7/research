{% extends "data-base.html" %}
{% block figure_body %}
  <section class="data-legend" aria-label="Chart legend">
    {% for series in chart.series %}
      <span class="legend-item{% if editorial and loop.index0 == focus_index %} is-focus{% endif %}" style="--series-color: {{ series.color }}">
        <svg class="legend-swatch" viewBox="0 0 42 8" aria-hidden="true"><line x1="2" x2="40" y1="4" y2="4" stroke="{{ series.color }}" stroke-width="4"{% if series.dash %} stroke-dasharray="{{ series.dash }}"{% endif %}></line></svg>
        <span>{{ series.name }}</span>
      </span>
    {% endfor %}
  </section>

    <svg class="chart-svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ title }}">
      {% for tick in chart.ticks %}
        <line class="chart-grid" x1="{{ chart.left }}" x2="{{ chart.right_edge }}" y1="{{ tick.y }}" y2="{{ tick.y }}"></line>
        <text class="axis-label num" x="{{ chart.left - 20 }}" y="{{ tick.y + 8 }}" text-anchor="end">{{ tick.label }}</text>
      {% endfor %}
      {% for label in chart.x_labels %}
        {% if chart.dense_bar %}
        <text class="axis-label dense-axis" x="{{ label.x }}" y="{{ chart.height - 65 }}" text-anchor="end" transform="rotate(-35 {{ label.x }} {{ chart.height - 65 }})">{{ label.label }}</text>
        {% else %}
        <text class="axis-label" x="{{ label.x }}" y="{{ chart.height - 18 }}" text-anchor="middle">{{ label.label }}</text>
        {% endif %}
      {% endfor %}

      {% if chart.type == "line" %}
        {% for series in chart.series %}
          <polyline class="series-line{% if editorial and loop.index0 == focus_index %} is-focus{% endif %}" style="--series-color: {{ series.color }};{% if series.dash %}stroke-dasharray: {{ series.dash }};{% endif %}" points="{{ series.polyline }}"></polyline>
          {% set point = series.points[-1] %}
          <g{% if editorial and loop.index0 == focus_index %} class="is-focus"{% endif %} style="--series-color: {{ series.color }}">
            {% if editorial and loop.index0 == focus_index %}<circle class="focus-halo" cx="{{ point.x }}" cy="{{ point.y }}" r="17"></circle>{% endif %}
            <circle class="series-point" cx="{{ point.x }}" cy="{{ point.y }}" r="6"></circle>
            <line class="end-leader" x1="{{ point.x + 10 }}" y1="{{ point.y }}" x2="{{ point.x + 30 }}" y2="{{ point.end_label_y }}"></line>
            <text class="point-value end-value num" x="{{ point.x + 40 }}" y="{{ point.end_label_y + 9 }}">{{ point.label }}</text>
          </g>
        {% endfor %}
      {% else %}
        {% for series in chart.series %}
          {% for bar in series.bars %}
            <rect class="series-bar" style="--series-color: {{ series.color }}" x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.width }}" height="{{ bar.height }}"></rect>
            {% if bar.show_label %}<text class="point-value num" style="--series-color: {{ series.color }}" x="{{ bar.label_x }}" y="{{ bar.label_y }}">{{ bar.label }}</text>{% endif %}
          {% endfor %}
        {% endfor %}
      {% endif %}
    </svg>
  {% if takeaways %}
  <section class="takeaway-grid" style="--takeaway-count: {{ takeaways|length }}">
    {% for item in takeaways %}
      <article class="takeaway">
        <span class="takeaway-label">{{ item.label }}</span>
        <strong class="takeaway-value num">{{ item.value }}</strong>
      </article>
    {% endfor %}
  </section>
  {% endif %}
{% endblock %}
