<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="{{ assets_uri }}/styles.css">
  <style>
    :root {
      --canvas-width: {{ width }}px;
      --canvas-height: {{ height }}px;
      --accent: {{ accent }};
      {% if preview_palette %}
      --preview-data: {{ preview_palette.data }};
      --preview-text: {{ preview_palette.text }};
      {% endif %}
    }
  </style>
  <title>{{ title }}</title>
</head>
<body{% if preview_palette %} class="palette-preview"{% endif %}>
  {% block canvas %}{% endblock %}
</body>
</html>
