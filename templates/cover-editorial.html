{% extends "base.html" %}
{% block canvas %}
<main class="canvas cover-editorial-canvas">
  <section class="editorial-copy">
    <h1 class="editorial-title">{{ title }}</h1>
    <p class="editorial-subtitle">{{ subtitle }}</p>
    {% if author is defined and author %}<div class="meta-row editorial-byline"><span>{{ author }}</span></div>{% endif %}
  </section>

  <div class="editorial-visual" aria-hidden="true"></div>

  {% set footer_class = "cover-footer" %}
  {% set logo_treatment = "logo-on-light" %}
  {% include "partials/fixed-footer.html" %}
</main>
{% endblock %}
